name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-wheels:
    name: Build Linux wheel (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            manylinux: auto
          - arch: aarch64
            runner: ubuntu-24.04-arm
            manylinux: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bundle GPU profiles into the package
        run: mkdir -p python/virtualgpu/profiles && cp profiles/*.json python/virtualgpu/profiles/
      - name: Build cp310-abi3 wheel (Python 3.10-3.13)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.arch }}
          args: --release --out dist --strip
          manylinux: ${{ matrix.manylinux }}
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.arch }}
          path: dist/*.whl

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle GPU profiles into the package
        run: mkdir -p python/virtualgpu/profiles && cp profiles/*.json python/virtualgpu/profiles/
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  verify-wheel:
    name: Verify installed wheel in clean venv (Python ${{ matrix.python-version }})
    needs: [linux-wheels]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: /tmp/vgpu-wheels
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install wheel in clean venv and smoke-test schemas, profiles, and CLI
        run: |
          python -m venv /tmp/vgpu-smoke-venv
          /tmp/vgpu-smoke-venv/bin/pip install --upgrade pip
          /tmp/vgpu-smoke-venv/bin/pip install /tmp/vgpu-wheels/*.whl
          cd /tmp
          /tmp/vgpu-smoke-venv/bin/python - <<'PY'
          import json
          import virtualgpu
          from virtualgpu import _core

          print("virtualgpu version:", virtualgpu.__version__)
          for name in ("kernel_ir", "gpu_profile"):
              schema = json.loads(_core.schema(name))
              assert "$schema" in schema, f"missing $schema in {name}"
          profiles = virtualgpu.list_profiles()
          print("bundled profiles:", profiles)
          assert "rtx4070" in profiles and "gb10" in profiles
          p = virtualgpu.profile_path("rtx4070")
          assert p.is_file()
          PY
          /tmp/vgpu-smoke-venv/bin/virtualgpu --help

  release:
    name: Publish GitHub Release
    needs: [linux-wheels, sdist, verify-wheel]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release (wheels + sdist; no PyPI upload)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.whl
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
