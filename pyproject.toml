[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "virtualgpu"
version = "0.2.0"
description = "Predict the relative performance of GPU kernel variants without the GPU"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dependencies = ["jsonschema>=4"]

[project.urls]
Homepage = "https://github.com/VirtualGPU/VirtualGPU"
Repository = "https://github.com/VirtualGPU/VirtualGPU"

[project.scripts]
virtualgpu = "virtualgpu.cli:main"

[project.optional-dependencies]
# The frontend calls Triton internals; upgrade only after re-validating it.
triton = ["triton==3.9.0"]
# Hardware runner and scoring in validation/.
validation = [
    "numpy>=2,<3",
    "nvidia-ml-py>=13.615.71,<14",
    "cuda-bindings>=12.9.11,<14",
    "torch==2.15.0",
    "triton==3.9.0",
]

[tool.maturin]
manifest-path = "crates/vgpu-core/Cargo.toml"
python-source = "python"
module-name = "virtualgpu._core"
features = ["python"]
include = [
    { path = "schemas/*.json", format = "sdist" },
    { path = "profiles/*.json", format = "sdist" },
    { path = "python/virtualgpu/profiles/*.json", format = ["sdist", "wheel"] },
]
exclude = [
    "python/virtualgpu/frontend/tests/**",
]
